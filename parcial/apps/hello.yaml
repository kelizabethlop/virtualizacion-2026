# App: hello  ->  http://hello.kela.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: parcial-kela
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - name: hello
        image: nginxdemos/hello:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: parcial-kela
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-ingressroute
  namespace: parcial-kela
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`hello.kela.com`)
    services:
    - name: hello-service
      port: 80
