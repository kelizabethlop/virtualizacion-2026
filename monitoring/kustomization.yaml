apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-kela

resources:
  - namespace.yaml
  - prometheus.yaml
  - kube-state-metrics.yaml
  - loki.yaml
  - promtail.yaml
  - grafana.yaml
  - ingressroutes.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - config/prometheus.yml
  - name: loki-config
    files:
      - config/loki.yaml
  - name: promtail-config
    files:
      - config/promtail.yaml
  - name: grafana-datasources
    files:
      - config/datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - config/dashboards.yaml
  - name: grafana-dashboards
    files:
      - dashboards/metricas.json
      - dashboards/logs.json

generatorOptions:
  disableNameSuffixHash: true
