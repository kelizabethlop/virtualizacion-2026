apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: parcial-kela
  labels:
    app: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-service
  namespace: parcial-kela
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-ingressroute
  namespace: parcial-kela
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`whoami.kela.com`)
    services:
    - name: whoami-service
      port: 80
