# App: apache  ->  http://apache.kela.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: parcial-kela
  labels:
    app: apache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: httpd:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: parcial-kela
spec:
  type: ClusterIP
  selector:
    app: apache
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apache-ingressroute
  namespace: parcial-kela
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`apache.kela.com`)
    services:
    - name: apache-service
      port: 80
